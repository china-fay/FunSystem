<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#C20C0C">
  <title>FMusic · 你的私人空间</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- ===== 全局顶栏 ===== -->
    <header id="header">
      <div class="header-inner">
        <div class="logo" onclick="location.reload()">
          <div class="logo-icon">♪</div>
          <h1>FMusic</h1>
        </div>
        <div class="search-box" id="searchBoxWrap">
          <input type="text" id="searchInput" placeholder="搜索歌曲、歌手...">
          <button id="searchBtn" onclick="app.searchLocal()">🔍</button>
        </div>
      </div>
    </header>

    <!-- ===== 侧边栏 + 内容区 ===== -->
    <div id="layout">
      <!-- 侧边导航 -->
      <aside id="sidebar">
        <div class="sidebar-inner">
          <div class="sidebar-title">导航</div>
          <div class="sidebar-item active" data-module="music" onclick="app.switchModule('music')">
            <span class="sidebar-icon">🎵</span>
            <span class="sidebar-label">音乐</span>
          </div>
          <div class="sidebar-item" data-module="books" onclick="app.switchModule('books')">
            <span class="sidebar-icon">📚</span>
            <span class="sidebar-label">书籍</span>
          </div>
        </div>
      </aside>

      <!-- 模块容器 -->
      <div id="moduleContainer">
        <!-- ===== 音乐模块 ===== -->
        <div id="moduleMusic" class="module-panel active">
          <nav id="categoryNav" style="display:none">
            <div class="nav-inner"><span style="color:#999">所有歌手</span></div>
          </nav>

          <main id="main">
            <section id="homeSection">
              <div id="mainContent"></div>
            </section>
            <section id="searchSection" style="display:none">
              <div class="section-header">
                <h2>📋 搜索结果</h2>
                <span class="section-sub" id="searchResultCount"></span>
              </div>
              <div class="search-results" id="searchResults"></div>
            </section>
            <div id="loadingIndicator" style="display:none">
              <div class="spinner"></div>
              <p>加载中...</p>
            </div>
          </main>

          <footer id="footer">
            <div class="footer-inner">
              <p>&copy; 2026 FMusic · 仅供个人学习交流使用</p>
              <p>音乐数据来源于网易云音乐公开 API 接口，版权归原平台及音乐人所有</p>
              <p>请尊重知识产权，支持正版音乐 ❤️</p>
            </div>
          </footer>
        </div>

        <!-- ===== 书籍模块 ===== -->
        <div id="moduleBooks" class="module-panel">
          <!-- 由 books.js 渲染 -->
        </div>
      </div>
    </div>

    <!-- ===== 歌词面板（全局） ===== -->
    <div id="lyricPanel" class="lyric-panel">
      <div class="lyric-header">
        <span>🎵 歌词</span>
        <button id="closeLyricBtn" onclick="app.toggleLyricPanel()">✕</button>
      </div>
      <div class="lyric-scroll" id="lyricScroll">
        <div class="lyric-list" id="lyricList"></div>
      </div>
    </div>

    <!-- ===== 提示 Toast ===== -->
    <div id="errorToast" class="toast" style="display:none"></div>
  </div>

  <!-- ===== 底部播放器（独立于模块） ===== -->
  <div id="playerBar" class="player-bar">
    <div class="player-mini" onclick="app.expandPlayer()">
      <img id="miniCover" class="mini-cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect fill='%23ddd' width='60' height='60'/%3E%3Ctext x='30' y='35' text-anchor='middle' fill='%23999' font-size='24'%3E♪%3C/text%3E%3C/svg%3E" alt="cover">
      <div class="mini-info">
        <div class="mini-title" id="miniTitle">未播放</div>
        <div class="mini-artist" id="miniArtist">选择一首歌曲开始</div>
      </div>
      <button id="miniPlayBtn" class="mini-play-btn" onclick="player.togglePlay(event)">▶</button>
    </div>
    <div class="player-expanded" id="playerExpanded">
      <div class="player-left">
        <div class="player-cover-wrap">
          <img id="playerCover" class="player-cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect fill='%23ddd' width='60' height='60'/%3E%3Ctext x='30' y='35' text-anchor='middle' fill='%23999' font-size='24'%3E♪%3C/text%3E%3C/svg%3E" alt="cover">
          <div class="cover-disc-animation" id="discAnim"></div>
        </div>
        <div class="player-info">
          <div class="player-title" id="playerTitle">未播放</div>
          <div class="player-artist" id="playerArtist">选择一首歌曲开始</div>
        </div>
      </div>
      <div class="player-center">
        <div class="progress-bar-container">
          <span class="time current" id="currentTime">00:00</span>
          <div class="progress-bar" id="progressBar" onclick="player.seek(event)">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
          </div>
          <span class="time total" id="totalTime">00:00</span>
        </div>
        <div class="player-controls">
          <button id="prevBtn" class="ctrl-btn" onclick="player.prev()" title="上一曲">⏮</button>
          <button id="playBtn" class="ctrl-btn ctrl-play" onclick="player.togglePlay()">▶</button>
          <button id="nextBtn" class="ctrl-btn" onclick="player.next()" title="下一曲">⏭</button>
          <button id="lyricBtn" class="ctrl-btn" onclick="app.toggleLyricPanel()" title="歌词">📄</button>
          <button id="downloadBtn" class="ctrl-btn" onclick="app.downloadSong()" title="下载">⬇</button>
        </div>
      </div>
      <div class="player-right">
        <div class="volume-control">
          <span class="vol-icon">🔊</span>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" oninput="player.setVolume(this.value)">
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 下载确认弹窗 ===== -->
  <div id="downloadModal" class="modal-overlay" style="display:none;" onclick="closeDownloadModal(event)">
    <div class="modal-box">
      <h3>⚠️ 版权提醒</h3>
      <p>请遵守相关版权法律法规，下载的音乐文件仅限个人学习、研究使用，<strong>不得用于任何商业用途</strong>。</p>
      <p class="modal-note">若涉及侵权，请立即删除。</p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDownloadModal()">取消</button>
        <button class="btn-primary" onclick="confirmDownload()">我承诺遵守，开始下载</button>
      </div>
    </div>
  </div>

  <!-- ===== 脚本 ===== -->
  <script src="js/music-data.js"></script>
  <script src="js/player.js"></script>
  <script src="js/books.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
